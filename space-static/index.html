<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shora (Ṣọ́ra): Nigerian scam checker</title>
<meta name="description" content="Paste a suspicious SMS, WhatsApp or email. Shora checks it for Nigerian scam patterns in English, Pidgin, Yorùbá, Igbo and Hausa. Runs fully on your device.">
<meta name="theme-color" content="#0f3d2e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<style>
  :root {
    --ink: #13201b; --muted: #5b6b64; --line: #e3e8e5; --bg: #f6f8f7; --card: #ffffff;
    --brand: #0f3d2e; --brand2: #1b7f5a; --accent: #f2b33d;
    --scam: #c62828; --scam-bg: #fdecec; --warn: #b85c00; --warn-bg: #fff4e5; --safe: #1e7d4f; --safe-bg: #e8f6ee;
    --r: 16px; --shadow: 0 1px 2px rgba(16,32,24,.06), 0 6px 24px rgba(16,32,24,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, sans-serif;
    color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased;
  }
  header {
    background: radial-gradient(120% 140% at 0% 0%, #1b7f5a 0%, #0f3d2e 55%, #0a2a20 100%);
    color: #fff; padding: 28px 18px 64px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { font-size: 30px; line-height: 1; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -.02em; }
  h1 small { font-weight: 500; opacity: .75; font-size: 16px; margin-left: 6px; }
  .tagline { margin: 10px 0 0; opacity: .92; font-size: 15.5px; max-width: 34em; }
  main { margin-top: -44px; padding: 0 14px 28px; }
  .card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
  .card + .card { margin-top: 14px; }
  .langs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 12px; scrollbar-width: none; }
  .langs::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px;
    padding: 7px 13px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
  textarea {
    width: 100%; min-height: 132px; resize: vertical; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 12px 13px; font: inherit; font-size: 16px; color: var(--ink); background: #fbfcfb; outline: none;
  }
  textarea:focus { border-color: var(--brand2); background: #fff; box-shadow: 0 0 0 4px rgba(27,127,90,.12); }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .btn {
    flex: 1; border: 0; border-radius: 12px; padding: 13px 16px; font: inherit; font-weight: 650; font-size: 16px;
    background: var(--brand); color: #fff; cursor: pointer; min-height: 48px;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .55; cursor: progress; }
  .btn.ghost { flex: 0 0 auto; background: #eef2f0; color: var(--ink); font-weight: 550; }
  .never { margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
  .label { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; margin: 0 0 8px; }
  .examples { display: flex; flex-wrap: wrap; gap: 7px; }
  .examples .chip { font-size: 13.5px; padding: 6px 11px; background: #f3f6f4; border-color: transparent; }
  .examples .chip:hover { background: #e7eeea; }

  #result { display: none; }
  #result.show { display: block; animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .verdict { border-radius: 14px; padding: 16px; display: flex; gap: 12px; align-items: center; }
  .verdict .icon { font-size: 34px; line-height: 1; }
  .verdict .title { font-size: 21px; font-weight: 750; letter-spacing: -.01em; }
  .verdict .sub { font-size: 14px; opacity: .85; }
  .v-scam { background: var(--scam-bg); color: var(--scam); }
  .v-warn { background: var(--warn-bg); color: var(--warn); }
  .v-safe { background: var(--safe-bg); color: var(--safe); }
  .meter { height: 8px; border-radius: 99px; background: rgba(0,0,0,.08); overflow: hidden; margin-top: 8px; width: 100%; }
  .meter > span { display: block; height: 100%; border-radius: 99px; background: currentColor; transition: width .4s ease; }
  .careful { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 14px; display: none; }
  .section { margin-top: 16px; }
  .type { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .type .pct { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 14px; }
  ul.flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.flags li { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 15px; }
  ul.flags li b { display: block; font-weight: 600; }
  ul.flags li q { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; quotes: "“" "”"; word-break: break-word; }
  .advice { background: #f3f7f5; border-left: 4px solid var(--brand2); border-radius: 10px; padding: 12px 13px; font-size: 15.5px; }
  .disclaimer { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
  .privacy { display: flex; gap: 10px; align-items: center; font-size: 14.5px; }
  .privacy .lock { font-size: 22px; }
  footer { text-align: center; color: var(--muted); font-size: 13.5px; padding: 6px 16px 34px; }
  footer a { color: var(--brand2); text-decoration: none; font-weight: 600; }
  footer a:hover { text-decoration: underline; }
  footer p { margin: 6px 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (min-width: 640px) {
    header { padding: 40px 24px 76px; }
    h1 { font-size: 34px; }
    .card { padding: 20px; }
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8efeb; --muted: #9fb0a8; --line: #2a3832; --bg: #0d1512; --card: #141f1b;
            --scam-bg: #3a1717; --scam: #ff8a80; --warn-bg: #3a2a12; --warn: #ffc06e; --safe-bg: #12321f; --safe: #7ee2a8; }
    .chip { background: #18241f; color: var(--ink); }
    textarea { background: #101a16; color: var(--ink); }
    textarea:focus { background: #0f1814; }
    .btn { background: #1b7f5a; }
    .btn.ghost { background: #22302a; color: var(--ink); }
    .examples .chip { background: #1b2924; }
    .advice { background: #17241f; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><span class="logo" aria-hidden="true">🛡️</span><h1>Shora <small>Ṣọ́ra · “be careful”</small></h1></div>
    <p class="tagline" data-t="tagline"></p>
  </div>
</header>

<main class="wrap">
  <section class="card" aria-label="Check a message">
    <div class="langs" role="group" aria-label="Language" id="langs"></div>
    <label for="msg" class="sr">Message</label>
    <textarea id="msg" data-ph="placeholder" spellcheck="false" autocomplete="off"></textarea>
    <div class="row">
      <button class="btn" id="check" disabled data-t="loading"></button>
      <button class="btn ghost" id="clear" data-t="clear"></button>
    </div>
    <p class="never">🔒 <span data-t="never"></span></p>
  </section>

  <section class="card" id="result" aria-live="polite">
    <div class="verdict" id="verdict">
      <div class="icon" id="vIcon"></div>
      <div style="flex:1;min-width:0">
        <div class="title" id="vTitle"></div>
        <div class="sub"><span id="vPct"></span> <span data-t="scamProb"></span></div>
        <div class="meter"><span id="vBar"></span></div>
      </div>
    </div>
    <p class="careful" id="careful" data-t="careful"></p>

    <div class="section">
      <p class="label" data-t="type"></p>
      <div class="type"><span id="tIcon"></span><span id="tName"></span><span class="pct" id="tPct"></span></div>
    </div>
    <div class="section">
      <p class="label" data-t="flags"></p>
      <ul class="flags" id="flags"></ul>
    </div>
    <div class="section">
      <p class="label" data-t="todo"></p>
      <div class="advice" id="advice"></div>
    </div>
    <p class="disclaimer" data-t="disclaimer"></p>
  </section>

  <section class="card">
    <p class="label" data-t="examples"></p>
    <div class="examples" id="examples"></div>
  </section>

  <section class="card privacy">
    <span class="lock" aria-hidden="true">📵</span><span data-t="privacy"></span>
  </section>
</main>

<footer>
  <p>Open source (MIT) · <a href="https://github.com/kpealeakara-rgb/Shora" target="_blank" rel="noopener">GitHub repo</a> · <a href="https://huggingface.co/datasets/Nihilitybot666/naijascam" target="_blank" rel="noopener">NaijaScam dataset</a></p>
  <p>TF-IDF + logistic regression trained on NaijaScam v0.1 (97.8% test accuracy, synthetic data). Runs in your browser; no server, no tracking.</p>
</footer>

<script src="i18n.js"></script>
<script src="shora.js"></script>
<script src="app.js"></script>
<script src="model.js" async onload="window.__shoraReady && window.__shoraReady()"></script>
</body>
</html>
